name: ratchet-ci

on:
  push:
    paths:
      - "system_v7/constraint_core/**"
      - ".github/workflows/ratchet-ci.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "system_v7/constraint_core/**"
      - ".github/workflows/ratchet-ci.yml"

permissions:
  contents: read

concurrency:
  group: ratchet-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sympy z3-solver cvc5

      - name: Run harness
        working-directory: system_v7/constraint_core
        run: python run_all.py

  engines:
    if: ${{ vars.RATCHET_CI_ENGINES == '1' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ratchet-engines')) }}
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy sympy z3-solver cvc5 "jax[cpu]" torch

      - name: Mark Julia unavailable
        run: |
          echo "CI notice: Julia engine validation is skipped because Julia and sim-stack dependencies are not installed in this job."
          python - <<'PY'
          from pathlib import Path

          engines = Path("system_v7/constraint_core/engines")
          for path in sorted(engines.glob("julia_results*.json")):
              target = path.with_name(path.name + ".ci-skip")
              path.replace(target)
              print(f"CI notice: moved {path.name} to {target.name}; Julia output is outside this CI validator pass.")
          PY

      - name: Run engine validators
        working-directory: system_v7/constraint_core/engines
        run: |
          python oracle_targets.py
          python jax_engine.py
          python torch_engine.py
          python validate_engines.py
          python oracle_targets_3q.py
          python jax_engine_3q.py
          python torch_engine_3q.py
          python validate_engines_3q.py
