name: three-engine seal (contained numpy)

# Un-bypassable enforcement: runs on every push/PR on GitHub's servers, so a sim
# receipt that labels numpy load-bearing, or lacks real engine evidence, turns this
# check RED regardless of what any commit claims. --no-verify on a local hook cannot
# skip this.
#
# THE NUMPY RULE IS CONTAINMENT, NOT A BAN. The owner restored numpy on 2026-07-22,
# superseding the blanket ban this workflow was previously named after. Stated exactly:
#
#   ALLOWED   numpy in a CONTAINED role — a downstream satellite that consumes what an
#             authoritative engine produced and computes no observable of its own.
#   REJECTED  numpy labelled load_bearing, or evidenced as load-bearing because the
#             receipt's numeric work has no witnessed authoritative engine behind it.
#
# Containment is structural, not a keyword scan. three_engine_seal.py R1 rejects
# numpy/scipy/mpmath carrying a load_bearing label, and a numeric receipt must still
# show >=2 authoritative engines (JAX/Julia/PyTorch) agreeing on the SAME metric ID.
# Together those leave numpy no way to be the workhorse in disguise — the load-bearing
# witness has to come from an engine — while leaving the satellite seat open. Rule
# source: claimgate_plugin/claim_policy.json engine_requirement.control_only.
#
# Proven two-sided rather than asserted, because a one-sided test is also satisfied by
# a gate that rejects everything: claimgate_plugin/run_numpy_containment_regression.py
# runs a receipt with numpy supportive against a byte-identical copy with numpy
# load_bearing. Measured 2026-07-25 — contained exit 0 / ledger PASS, load-bearing
# exit 1 / ledger BLOCKED at the seal, engines witnessed on BOTH sides.
#
# That runner is LOCAL-ONLY and deliberately absent from this file. Witnessing an
# engine leg shells out to the developer's sim interpreter at a hardcoded absolute
# path, which no GitHub runner has, so a job running it here would be red for an
# environment reason. What CI does enforce is the metadata half — the numpy label,
# the engine count, and the agreement check — which needs no sim env. The jax
# re-derive stays local (pre-commit + Stop hook).
on:
  push:
  pull_request:

jobs:
  # RENAMED 2026-07-25 from `no-numpy-sims`, which asserted the superseded blanket
  # ban. If any branch-protection rule requires the old job name as a status check,
  # re-point it — a required check that names a job which no longer exists is not
  # enforcement, it is a permanently pending tick.
  three-engine-seal-sims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Three-engine seal over all sim receipts
        run: python3 scripts/ci_three_engine_seal.py

  # ---------------------------------------------------------------------------
  # LEAN GATE TIER, SERVER-SIDE.
  #
  # Measured reality this answers: `git commit --no-verify` bypasses the local
  # pre-commit gate entirely, so every checker that only fires from a hook is
  # optional in practice. These jobs fire where the committer has no --no-verify.
  #
  # Jobs 1-3 have no continue-on-error, no `|| true`, and no `if:` condition. They
  # are held against FROZEN FAILURE SETS (path + sha256 + exit) rather than count
  # budgets: a count is fungible, so repairing one old failure would free a slot for
  # a new poisoned receipt. Measured on that exact swap: --max-failures 1 exits 0
  # while the frozen set exits 1. Do not re-freeze a set to make a red build green.
  #
  # Deliberately-malformed fixture corpora are PINNED BY DIGEST in
  # claimgate_plugin/fixtures/sweep_fixture_manifest.json with the exit each checker
  # must return, and are RUN as regression inputs. They are not path-excluded: a
  # prefix cannot tell poison-we-wrote from poison-someone-parked, and that was the
  # cheapest bypass in this layer. Anything unpinned under a fixture root is swept
  # normally. Every baseline is frozen from `git ls-files`, because CI only ever
  # sees committed files.
  #
  # Install stays lean on purpose: stdlib + numpy + numba. No jax, no Julia, no
  # PyTorch in the gate tier (jax was measured at 529 ms against numpy's 52 ms for a
  # single recompute on CPU-only arm64, so it buys nothing here).
  #
  # numpy here is the SAME contained pattern the science-side rule allows, not an
  # exception to it. An earlier version of this comment claimed the two rules were
  # independent; they are not, and that framing is what let "no numpy" harden into a
  # blanket ban the owner then had to restore from. recompute_veto.py uses numpy to
  # RE-DERIVE a claimed number and refuse it. It computes nothing that can be
  # promoted and carries no claim of its own, so it is a downstream satellite by
  # construction — which is exactly the allowed role.
  # ---------------------------------------------------------------------------

  # JOB 1 — intake_supervisor over every live-era claim-bearing receipt.
  claimgate-intake-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Frozen live set, not --max-failures 0. The one recorded live failure
      # (system_v8/nested_manifold/results/rungB/receipt.json — a bare Infinity
      # literal, invalid JSON per RFC 8259) is REAL DEBT and is named in the frozen
      # set with its message. Held at zero tolerance it would paint this job red
      # forever, which is how a check gets ignored. Editing the receipt to green the
      # build is worse: that is science content. So the finding stays recorded and
      # any NEW live failure still fails, including a swap that repairs rungB and
      # spends the slot elsewhere.
      - name: Reject poisoned claim receipts before downstream normalization
        run: |
          python3 claimgate_plugin/ci_receipt_sweep.py \
            --checker claimgate_plugin/intake_supervisor.py --scope live \
            --frozen-failures claimgate_plugin/baselines/frozen_failures_intake_supervisor_live.json

  # JOB 2 — hostile-control battery. Must stay 10 HOLDS, no-drift.
  # Needs node with node:sqlite (4 classes drive claim_admission.mjs against a
  # committed sqlite ledger), so node 22 is pinned rather than left to the runner
  # image. No npm install: every import in those .mjs files is a node: builtin.
  # numpy/numba are installed because the post_receipt_gate.sh chain reaches
  # recompute_veto.py, which fails CLOSED when numpy is missing — an uninstalled
  # dependency must not be able to change a recorded fixture exit.
  claimgate-hostile-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lean gate-tier dependencies
        run: python3 -m pip install --disable-pip-version-check numpy numba
      - name: Run hostile-control no-drift battery
        run: bash claimgate_plugin/fixtures/hostile/run_hostile_controls.sh

  # JOB 3 — recompute_veto over the SAME receipt set as job 1.
  claimgate-recompute-veto-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lean gate-tier dependencies
        run: python3 -m pip install --disable-pip-version-check numpy numba
      # Frozen live set holds ZERO entries: live recompute is genuinely clean, so
      # this is zero tolerance expressed as an empty set rather than a count.
      - name: Re-derive claimed aggregates instead of trusting them
        run: |
          python3 claimgate_plugin/ci_receipt_sweep.py \
            --checker claimgate_plugin/recompute_veto.py --scope live \
            --frozen-failures claimgate_plugin/baselines/frozen_failures_recompute_veto_live.json

  # JOB 4 — orphan-receipt ratchet, held against the FROZEN SET in
  # claimgate_plugin/ci_orphan_baseline.json (path + sha256, 2198 entries frozen from
  # `git ls-files` in place). Fails on a NEW orphan or a MUTATED grandfathered one; a
  # count would let one be swapped for the other. Wiring the detector's raw exit 1
  # straight into CI would fail on a known baseline and enforce nothing.
  # The count above is CHECKED: claimgate_plugin/review_bundle.py --verify fails if it
  # drifts from the frozen set. It read 1871 until 2026-07-25, measured from a temp
  # clone that was not a clean checkout.
  claimgate-orphan-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report orphan-receipt count and enforce the down-only ratchet
        run: python3 claimgate_plugin/ci_orphan_ratchet.py

  # JOB 5 — the historical archives (system_v4..v7, work/) under the same two
  # checkers, held at recorded ceilings that may only be lowered. This is what makes
  # "every claim-bearing receipt" true rather than "every current-era one", without
  # painting the build permanently red over 2026-04 receipts in a read-only mine.
  # The ceilings are debt, not a pass. See ci_ratchet_baseline.json for the caveat
  # that part of the recompute ceiling is heuristic noise, not science findings.
  claimgate-legacy-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lean gate-tier dependencies
        run: python3 -m pip install --disable-pip-version-check numpy numba
      # FROZEN SETS, NOT COUNTS. A count budget is fungible: repair one old failing
      # receipt and a free slot opens for a new poisoned one, with CI still green.
      # Measured on exactly that swap: --max-failures 1 exits 0 (blind) while the
      # frozen set exits 1 (new=1 repaired=1, same total). Identity, not arithmetic.
      - name: Whole-repo intake sweep against its frozen failure set
        run: |
          python3 claimgate_plugin/ci_receipt_sweep.py \
            --checker claimgate_plugin/intake_supervisor.py --scope all \
            --frozen-failures claimgate_plugin/baselines/frozen_failures_intake_supervisor_all.json
      - name: Whole-repo recompute sweep against its frozen failure set
        run: |
          python3 claimgate_plugin/ci_receipt_sweep.py \
            --checker claimgate_plugin/recompute_veto.py --scope all \
            --frozen-failures claimgate_plugin/baselines/frozen_failures_recompute_veto_all.json

  claimgate-flip-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flip-harness dependencies
        run: python3 -m pip install --disable-pip-version-check z3-solver "jax[cpu]"
      - name: Run load-bearing mechanism flip battery
        run: |
          python3 system_v8/harness_patch/flip_harness.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          result_path = Path("system_v8/harness_patch/results/flip_harness_v0.json")
          results = {row["label"]: row for row in json.loads(result_path.read_text())["results"]}
          positive = results["type1_deductive_loop"]
          control = results["NEGATIVE_CONTROL_commuting_z_only"]
          positive_ok = (
              positive["test_1_erase"]["erase_flips"]
              and positive["test_2_perturb"]["flip_rate"] > 0.5
              and positive["test_3_core"]["core_is_subset"]
          )
          control_ok = (
              not control["test_1_erase"]["erase_flips"]
              and control["test_2_perturb"]["flip_rate"] <= 0.5
              and not control["test_3_core"]["core_is_subset"]
          )
          if not (positive_ok and control_ok):
              raise SystemExit("flip harness mechanism/control assertions failed")
          print("flip harness mechanism/control assertions passed")
          PY
