schema: lev.flowmind.flow.v1
id: claimgate.measure
description: Run ClaimGate's deterministic tri-valued verifier over verdict-free provider evidence.
inputs:
  receipt_path:
    type: string
    required: true
outputs:
  observations:
    type: object
  measurements:
    type: object
nodes:
  - id: score_claim
    kind: companion.score
    inputs:
      companion: ../companions/sensor.mjs
      receipt_path: ${inputs.receipt_path}
    outputs:
      variables:
        - claim_verify_exit_code
        - claim_verified
        - provider_verdict_bits_present
        - disposition
