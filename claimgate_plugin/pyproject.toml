[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-claimgate"
version = "0.1.0.dev1"
description = "Independent deterministic claim-admission and evidence gates"
requires-python = ">=3.11"
dependencies = [
  "z3-solver>=4.16.0.0,<4.17.0.0",
  "cvc5>=1.3.3,<1.4.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
claimgate-floor = "claimgate_plugin.ratchet_floor:main"
claimgate-floor-smt = "claimgate_plugin.ratchet_floor_smt:main"
claimgate-verify = "claimgate_plugin.claim_verify:main"

[tool.setuptools]
packages = ["claimgate_plugin"]
package-dir = {claimgate_plugin = "."}
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
