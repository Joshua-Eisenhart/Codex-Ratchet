[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintbox"
version = "0.4.0.dev1"
description = "CB Light-only deterministic control-plane runtime"
requires-python = ">=3.11,<3.14"
dependencies = [
    "z3-solver>=4.16.0.0,<4.17.0.0",
    "cvc5>=1.3.3,<1.4.0",
    "sympy>=1.14.0,<1.15.0",
    "rustworkx>=0.17.0,<0.18.0",
    "maude==1.6.0",
]

[project.optional-dependencies]
control-plane = [
    "pydantic==2.12.5",
    "jsonschema==4.26.0",
]

[project.scripts]
constraintbox = "constraintbox.core_cli:main"

[tool.setuptools]
packages = ["constraintbox", "hookkernel"]

[tool.setuptools.package-dir]
constraintbox = "src/constraintbox"
hookkernel = "src/hookkernel"

[tool.setuptools.package-data]
constraintbox = ["core_tool_registry_v9.json"]
hookkernel = [
    "cb_light_data/config/*.json",
    "cb_light_data/docs/*.md",
    "cb_light_data/requirements/candidates/*.in",
    "cb_light_data/requirements/control_plane_candidates/*.txt",
    "cb_light_data/pyproject.toml",
]
