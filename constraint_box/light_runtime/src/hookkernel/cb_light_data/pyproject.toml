[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintbox"
version = "0.4.0.dev1"
description = "Lean deterministic finite-constraint and Mini-Lev controller"
requires-python = ">=3.11,<3.14"
dependencies = [
    "z3-solver>=4.16.0.0,<4.17.0.0",
    "cvc5>=1.3.3,<1.4.0",
    "sympy>=1.14.0,<1.15.0",
    "rustworkx>=0.17.0,<0.18.0",
    "maude==1.6.0",
]

[project.optional-dependencies]
# These five are the pinned contract, asserted by tests/test_package_resources.py.
# Do not add extras that widen the declared core: the core registry names exactly five
# tools and three boundary tests enforce it. libcst was briefly added as a sixth hard
# dependency on 2026-08-09 and removed; gate_integrity_ast.py must degrade without it.
symbolic = ["sympy>=1.14.0,<1.15.0"]
graph = ["rustworkx>=0.17.0,<0.18.0"]
# Maude is a required bounded formal/rewrite gate, not an optional simulation extra.
rewrite = []
numeric = ["numpy==2.3.4"]
test = ["hypothesis==6.151.12"]
# This optional profile is a bounded candidate-evaluation surface.  It does
# not widen the declared five-tool core or establish CB Light membership.
control-plane = [
    "pydantic==2.12.5",
    "jsonschema==4.26.0",
]

[project.scripts]
constraintbox = "constraintbox.core_cli:main"
constraintbox-legacy = "constraintbox.cli:main"

[tool.setuptools.packages.find]
# `hookkernel` is the deterministic CB Light state/gate package.  It lives at
# the project root while the public CLI lives under src/, so both roots must be
# part of the installed distribution.  Without this, the source-tree CLI can
# work through PYTHONPATH while the installed `constraintbox` command fails.
where = ["src", "."]
include = ["constraintbox*", "hookkernel*"]

[tool.setuptools.package-data]
constraintbox = [
    "core_tool_registry_v9.json",
    "formal_runtime/*.json",
    "formal_runtime/controller_lifecycle_v1/*",
    "runtime_profiles/*.json",
]
hookkernel = [
    "cb_light_data/config/*.json",
    "cb_light_data/docs/*.md",
    "cb_light_data/requirements/candidates/*.in",
    "cb_light_data/requirements/control_plane_candidates/*.txt",
    "cb_light_data/pyproject.toml",
]
