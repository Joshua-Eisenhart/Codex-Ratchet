[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintbox"
version = "0.3.4"
description = "Deterministic constraint controller for bounded LLM, formal-tool, and external-workload receipts"
requires-python = ">=3.11,<3.14"
dependencies = [
    "z3-solver>=4.16.0.0,<4.17.0.0",
    "cvc5>=1.3.3,<1.4.0",
    "sympy>=1.14.0,<1.15.0",
    "rustworkx>=0.17.0,<0.18.0",
    "maude==1.6.0",
]

[project.optional-dependencies]
symbolic = ["sympy>=1.14.0,<1.15.0"]
graph = ["rustworkx>=0.17.0,<0.18.0"]
rewrite = []
formal = []
numeric = ["numpy==2.3.4"]
test = ["hypothesis==6.151.12"]

[project.scripts]
constraintbox = "constraintbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
constraintbox = [
    "formal_runtime/*.json",
    "formal_runtime/controller_lifecycle_v1/*",
    "runtime_profiles/*.json",
]
