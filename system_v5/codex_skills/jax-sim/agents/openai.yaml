interface:
  display_name: "JAX Sim"
  short_description: "Use JAX with rich load-bearing packages"
  default_prompt: "Use $jax-sim to build or audit the JAX side with x64, direct repo Python, and function-level rich-tool receipts. JAX is the batched/exhaustive workhorse after Julia Canon fixes algebra/order: use vmap/jit sweeps, dynamics, scale searches, vectorized witness generation, and proof-shaped finite objects. Require at least one real API call beyond jax.numpy, such as jax.vmap/jit over the claimed batch, diffrax.diffeqsolve, dynamiqs.mesolve, quimb/cotengra contraction, netket/e3nn_jax/ott/jraph, z3/cvc5, blackjax, numpyro, optax, jaxopt, lineax, or optimistix, recorded in tool_calls/TOOL_MANIFEST with positive, negative, boundary, and demotion conditions. Do not use bayeux, oryx, jax-verify, host_callback, jax.interpreters internals, or old Julia Jax.jl wrappers. Treat pmap as compatibility, not default architecture. Optimizers/samplers are candidate or counterexample generators, never proof without exact finite/SMT/interval certification."
