interface:
  display_name: "PyTorch Sim"
  short_description: "Use PyTorch rich support tools"
  default_prompt: "Use $pytorch-sim to build or audit the PyTorch graph/network/autograd machinery lane with function-level tool receipts, not decorative tensor mirrors. PyTorch is first-class when torch_geometric, torch.func/functorch, torch_ga, torch-backed geomstats with GEOMSTATS_BACKEND=pytorch, e3nn, torchdiffeq, torchode, xitorch, cvxpylayers, or z3/cvc5/sympy over torch-derived finite values carries the claim; it is never the semantic arbiter over Julia Canon. Do not assume dgl, torch_scatter, torch_sparse, pyg-lib, torch-cluster, or torch-spline-conv exist without a pinned wheel/container receipt. Optimizers and differentiable solvers generate witnesses, not proof; certify through exact finite/SMT/interval/Julia Canon before promotion. Use --require-pytorch only for explicit all-three or PyTorch-scoped envelopes."
