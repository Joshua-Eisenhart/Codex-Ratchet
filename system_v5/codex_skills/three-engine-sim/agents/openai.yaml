interface:
  display_name: "Three Engine Sim"
  short_description: "Require mode-declared Julia/JAX/PyTorch rich-tool receipts"
  default_prompt: "Use $three-engine-sim to author or audit one bounded Codex Ratchet sim with Julia Canon authority, JAX batched/exhaustive workhorse scope, PyTorch graph/network/autograd machinery when scoped, and load-bearing proof receipts. Declare engine_contract.mode before validation; use --require-pytorch only for explicit all-three envelopes or PyTorch-scoped claim paths. For Julia Canon artifact consumers, read system_v5/docs/JULIA_CANON_RUNTIME_CONTRACT.md and require canon_runtime plus foreign_runtime_manifest fields. Every scoped engine must record source_path/source_sha256, packages_used, aligned_packages_load_bearing, reads_peer_result=false, and per-tool function/API calls with positive, negative, boundary, and demotion conditions. Enforce the proof ladder: simulation witness -> exact finite algebra/table check -> z3/cvc5 SMT -> interval/reachability/SOS/JuMP for continuous claims -> Julia Canon manifest. Cross-engine exchange must be explicit DLPack or versioned binary tensor receipt; no PyCall/.numpy/np.asarray/CSV/pickle claim path. Keep classification scratch_diagnostic unless the exact repo gates admit more."
