name: stage16x4-system-id-verify
entry: run_pysindy_capability

policy:
  determinism: true
  sdk_first: true

nodes:
  run_pysindy_capability:
    type: action
    description: "Regenerate the bounded PySINDy function receipt."
    op: lev.validate
    inputs:
      command: "/Users/joshuaeisenhart/.local/share/sim-stack/bin/python3 system_v4/probes/sim_pysindy_capability.py"
    output: pysindy_capability_result
    branches:
      pass: run_pykoopman_capability
      fail: failed

  run_pykoopman_capability:
    type: action
    description: "Regenerate the bounded PyKoopman Identity plus EDMD receipt."
    op: lev.validate
    inputs:
      command: "/Users/joshuaeisenhart/.local/share/sim-stack/bin/python3 system_v4/probes/sim_pykoopman_capability.py"
    output: pykoopman_capability_result
    branches:
      pass: run_instrument
      fail: failed

  run_instrument:
    type: action
    description: "Run the conditional 16 x 4 system-identification instrument."
    op: lev.validate
    inputs:
      command: "/Users/joshuaeisenhart/.local/share/sim-stack/bin/python3 system_v7/sims/stage16x4_system_id_instrument_v0/stage16x4_system_id_instrument_v0.py"
    output: instrument_result
    branches:
      pass: validate_result
      fail: failed

  validate_result:
    type: action
    description: "Run the independent mechanical result validator."
    op: lev.validate
    inputs:
      command: "/Users/joshuaeisenhart/.local/share/sim-stack/bin/python3 system_v7/sims/stage16x4_system_id_instrument_v0/validate_stage16x4_system_id_instrument_v0.py"
    output: validator_result
    branches:
      pass: lint_contracts
      fail: failed

  lint_contracts:
    type: action
    description: "Check the two executable files against the sim contract."
    op: lev.validate
    inputs:
      command: "/Users/joshuaeisenhart/.local/share/sim-stack/bin/python3 scripts/lint_sim_contract.py system_v4/probes/sim_pysindy_capability.py system_v4/probes/sim_pykoopman_capability.py system_v7/sims/stage16x4_system_id_instrument_v0/stage16x4_system_id_instrument_v0.py system_v7/sims/stage16x4_system_id_instrument_v0/validate_stage16x4_system_id_instrument_v0.py"
    output: lint_result
    branches:
      pass: test_packet
      fail: failed

  test_packet:
    type: action
    description: "Run the packet result-contract tests."
    op: lev.validate
    inputs:
      command: "/Users/joshuaeisenhart/.local/share/sim-stack/bin/python3 -m pytest -q system_v7/sims/stage16x4_system_id_instrument_v0/tests"
    output: test_result
    branches:
      pass: done
      fail: failed

  failed:
    terminal: true
    description: "At least one deterministic packet gate failed."

  done:
    terminal: true
    description: "Instrument, validator, contract lint, and packet tests all passed."
