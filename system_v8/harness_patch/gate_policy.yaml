# ClaimGate harness policy — POLICY AS DATA, not code.
# Written against Lev's context/schemas/abstract-hooks.yaml lifecycle events so
# ONE policy covers every adapter (claude-code, cursor, openclaw, codex, pi, grok)
# instead of one hook file per vendor.
#
# Status: PROPOSED patch. Nothing here is installed in ~/lev-main (read-only).
name: claimgate-harness-policy
version: 0.1.0-proposed
speaks: abstract-hooks@1.0.0

# ── Verdict vocabulary ───────────────────────────────────────────────
# Deliberately NOT {pass, approved, ok}. Models launder "INTAKE_APPROVED"
# into "admitted". The pre-run seal must never emit a scientific PASS.
verdicts:
  pre_run:  [ROUTE_SEALED, PENDING_EVIDENCE, PARKED_POLICY, BLOCKED_INVALID]
  post_run: [ADMITTED_WITHIN_CEILING, PENDING_EXTERNAL_CHECK, PARKED_INCOMPARABLE,
             BLOCKED, QUARANTINED_FLEET_DEFECT]

# ── Enforcement level, stated honestly on every receipt ──────────────
# E0 record checker | E1 route broker | E2 supervised execution
# E3 capability-confined runtime | E4 host-mediated runtime
# A hook inside the agent's own process is E2 AT BEST. It may say
# "admission control". It may NEVER say "bypass prevented".
enforcement_level: E2_SUPERVISED_EXECUTION
forbidden_wording: ["bypass prevented", "cannot be bypassed", "sandboxed", "non-bypass"]

# ── Mount points (abstract-hooks lifecycle events) ───────────────────
mounts:
  task_start:
    action: mint_run_ticket
    ticket:
      nonce_generated_by: broker      # NOT the candidate process, or it is decorative
      binds: [claim_sentence, claim_ceiling, allowed_write_roots, allowed_tools,
              contract_digest, policy_digest, source_digest]
      immutable: true                 # post-seal change = new generation

  pre_tool_use:
    action: route_seal
    checks:
      - id: ticket_scope
        rule: tool must appear in ticket.allowed_tools
        on_fail: BLOCKED_INVALID
      - id: write_root
        rule: every write path must canonicalize (realpath) inside ticket.allowed_write_roots
        on_fail: BLOCKED_INVALID
        note: protects ~/lev-main as read-only; symlink/.. traversal resolved first
      - id: protected_root
        rule: never write inside a protected root even via symlink or hardlink
        protected_roots: ["~/lev-main"]
        on_fail: BLOCKED_INVALID
      - id: nonce_present
        rule: ticket nonce must be live and unexpired
        on_fail: PENDING_EVIDENCE

  post_tool_use:
    action: admission_seal
    checks:
      - id: strict_intake
        rule: parse raw bytes ONCE with duplicate-key rejection and a finite-number
              guard, BEFORE object construction; hash raw bytes pre-canonicalization
        on_fail: BLOCKED
      - id: no_self_verdict
        rule: producer fields {pass, all_pass, approved, promotion_allowed, solved,
              certified} are stored as untrusted claims, never read as verdicts
        on_fail: BLOCKED
      - id: recompute
        rule: the gate recomputes every accepted numeric from raw artifacts;
              a producer-asserted value is not evidence
        on_fail: BLOCKED
      - id: missing_is_not_ok
        rule: a missing required artifact is BLOCKED_MISSING, never N/A-ok
        on_fail: BLOCKED

  validation_fail:
    action: park_with_reentry
    require: [exact_failure, reentry_condition]   # Purgatory is not deletion

  escalation:
    action: route_to_owner
    when: [owner_decision_open, incomparable_frontier, unresolved_semantic_authority]

# ── Applicability: the dev's "each domain has its own acceptance criteria" ──
# Only POLICY assigns these. A producer may REQUEST a lane; it can never
# downgrade a requirement or promote an optional lane.
applicability:
  states: [REQUIRED_GENERATOR, REQUIRED_REFERENCE, REQUIRED_ADMISSION_CHECK,
           OPTIONAL_SUPPORT, FORBIDDEN, NOT_APPLICABLE]
  by_claim_type:
    documentation:        {julia: NOT_APPLICABLE, jax: NOT_APPLICABLE, z3: NOT_APPLICABLE, lev: NOT_APPLICABLE}
    bounded_numerical:    {julia: REQUIRED_REFERENCE, jax: REQUIRED_GENERATOR, numpy: OPTIONAL_SUPPORT, z3: OPTIONAL_SUPPORT}
    mechanism_dependency: {jax: REQUIRED_GENERATOR, z3: REQUIRED_ADMISSION_CHECK}   # the flip battery
    host_execution:       {lev: REQUIRED_ADMISSION_CHECK}
    theorem_level:        {z3: OPTIONAL_SUPPORT, note: "finite result never satisfies a native theorem claim"}
  rule: >
    NOT_APPLICABLE lanes emit typed non-evidence. Never fabricate a lane to make
    schema validation pass. An empty required row evaluates to PENDING, not PASS.

# ── Anti-theatre: the mechanical regress terminator ──────────────────
# This is what makes the gate not-theatre without an agent watching the worker.
anti_theatre:
  harness: flip_harness.py
  applies_to_claim_types: [mechanism_dependency, bounded_numerical]
  tests:
    - id: erase
      rule: drop the pinned mechanism -> verdict MUST become SAT
    - id: perturb
      rule: perturb pinned entries (JAX-batched) -> flip_rate MUST exceed threshold
      threshold: 0.5
    - id: core
      rule: unsat core must be a subset of the real pinned constraints
  llm_tokens_required: 0
  rationale: >
    Agents checking the eval of the eval does not terminate and the token spend
    is unbounded. These three tests terminate the regress in computation. A
    tautological gate scores flip_rate ~ 0 mechanically.

# ── Bridge to Lev (verified CLI contracts only) ──────────────────────
lev_bridge:
  emit:     "events.jsonl"                                   # one JSON object per line
  dispatch: "lev triggers dispatch <events.jsonl> --receipt <receipt.json> --json"
  validate: "lev gate validate <gate-id> --json"
  contract:
    - CR proposes, Lev decides.
    - Receipts carry evidence only, never verdict bits.
    - live_lev_consumed=false means evidence-import, NOT "ran under LevOS".
  never: ["write inside ~/lev-main", "modify lev sources", "vendor lev into CR"]
