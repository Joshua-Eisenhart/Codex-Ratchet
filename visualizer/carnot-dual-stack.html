<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnot Dual Stack</title>
<style>
  :root {
    --bg: #11130f;
    --panel: #181b16;
    --panel2: #20241d;
    --line: #3b4335;
    --text: #ece9df;
    --muted: #a8aa9f;
    --hot: #d95f43;
    --cold: #3aa0a7;
    --work: #d8b65c;
    --ok: #7fb069;
    --bad: #c44536;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
  }
  aside {
    border-right: 1px solid var(--line);
    padding: 18px;
    background: #0f110e;
  }
  section { padding: 18px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 20px; letter-spacing: 0; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .mono { font-family: "SFMono-Regular", Consolas, monospace; }
  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 18px;
  }
  .metric {
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 10px;
  }
  .metric strong { display: block; font-size: 18px; }
  .metric span { color: var(--muted); font-size: 11px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    border: 1px solid var(--line);
    padding: 7px 9px;
    background: var(--panel);
    font-size: 12px;
  }
  .dot { width: 8px; height: 8px; background: var(--ok); border-radius: 50%; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(260px, 1fr));
    gap: 16px;
  }
  .loop {
    border: 1px solid var(--line);
    background: var(--panel);
    min-height: 420px;
  }
  .loop header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 14px;
    border-bottom: 1px solid var(--line);
  }
  .loop header h3 { font-size: 16px; }
  .cycle {
    position: relative;
    height: 250px;
    margin: 16px;
    border: 1px solid var(--line);
    background:
      linear-gradient(90deg, rgba(217,95,67,.12), transparent 40%, rgba(58,160,167,.12));
  }
  .node {
    position: absolute;
    width: 74px;
    min-height: 50px;
    border: 1px solid var(--line);
    background: var(--panel2);
    padding: 7px;
    transform: translate(-50%, -50%);
  }
  .node b { display: block; font-size: 13px; }
  .node span { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
  .a { left: 22%; top: 24%; }
  .b { left: 78%; top: 24%; }
  .c { left: 78%; top: 76%; }
  .d { left: 22%; top: 76%; }
  .edge {
    position: absolute;
    border-color: var(--work);
    color: var(--muted);
    font-size: 11px;
  }
  .top { left: 31%; right: 31%; top: 23%; border-top: 2px solid var(--hot); }
  .right { top: 34%; bottom: 34%; right: 21%; border-right: 2px solid var(--work); }
  .bottom { left: 31%; right: 31%; bottom: 23%; border-bottom: 2px solid var(--cold); }
  .left { top: 34%; bottom: 34%; left: 21%; border-left: 2px solid var(--work); }
  .trace {
    display: grid;
    gap: 6px;
    padding: 0 14px 14px;
  }
  .stage {
    display: grid;
    grid-template-columns: 1fr 74px 74px;
    gap: 8px;
    align-items: center;
    border: 1px solid var(--line);
    padding: 8px;
    background: #141711;
    font-size: 12px;
  }
  .stage span { color: var(--muted); font-size: 11px; }
  .checks {
    margin-top: 16px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 14px;
  }
  .checkgrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .check {
    border: 1px solid var(--line);
    padding: 8px;
    background: #141711;
    font-size: 12px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .grid, .checkgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <aside>
    <h1>Carnot Dual Stack</h1>
    <p class="muted" style="margin-top:8px; line-height:1.45">One reversible Carnot rectangle, two opposite traversals: inductive heating forward and deductive cooling in reverse.</p>
    <div id="status" class="status"><i class="dot"></i><span>loading</span></div>
    <div id="summary" class="summary"></div>
  </aside>
  <section>
    <div id="loops" class="grid"></div>
    <div class="checks">
      <h2>Receipts</h2>
      <div id="checks" class="checkgrid"></div>
    </div>
  </section>
</main>
<script src="carnot-dual-stack-data.js"></script>
<script>
const data = window.CARNOT_DUAL_STACK_DATA;
const fmt = value => Number.isFinite(value) ? value.toFixed(6) : String(value);
const summary = data.summary;

document.querySelector("#status span").textContent = summary.all_pass ? "all local checks pass" : "checks need audit";
document.querySelector(".dot").style.background = summary.all_pass ? "var(--ok)" : "var(--bad)";

const metrics = [
  ["eta", summary.forward_efficiency],
  ["Carnot bound", summary.forward_carnot_bound],
  ["COP", summary.reverse_cop],
  ["COP bound", summary.reverse_cop_carnot],
  ["tools", `${summary.load_bearing_tool_count}/${summary.tool_count}`],
  ["Q cold rev", summary.q_cold_absorbed_reverse],
];
document.getElementById("summary").innerHTML = metrics.map(([label, value]) => `
  <div class="metric"><strong>${typeof value === "number" ? fmt(value) : value}</strong><span>${label}</span></div>
`).join("");

const statePos = { A: "a", B: "b", C: "c", D: "d" };
function stateKey(label) { return label.charAt(0); }
function loopCard(loop, title) {
  const stages = loop.stage_trace.map(row => `
    <div class="stage">
      <div><b>${row.kind}</b><br><span>${row.before} -> ${row.after}</span></div>
      <div class="mono">${fmt(row.delta_entropy)}</div>
      <div class="mono">${fmt(row.work_by_system)}</div>
    </div>
  `).join("");
  const nodes = data.states.map(s => `
    <div class="node ${statePos[stateKey(s.label)]}">
      <b>${stateKey(s.label)}</b>
      <span>T=${fmt(s.temperature)} g=${fmt(s.gap)}</span>
      <span>S=${fmt(s.entropy)}</span>
    </div>
  `).join("");
  return `
    <article class="loop">
      <header>
        <h3>${title}</h3>
        <span class="muted">${loop.role}</span>
      </header>
      <div class="cycle">
        <div class="edge top"></div>
        <div class="edge right"></div>
        <div class="edge bottom"></div>
        <div class="edge left"></div>
        ${nodes}
      </div>
      <div class="trace">
        <div class="stage muted"><div>stage</div><div>dS</div><div>work</div></div>
        ${stages}
      </div>
    </article>
  `;
}
document.getElementById("loops").innerHTML = [
  loopCard(data.loops.inductive_heating_loop, "Inductive Heating Loop"),
  loopCard(data.loops.deductive_cooling_loop, "Deductive Cooling Loop")
].join("");

const checks = [
  ["z3 super-Carnot", data.boundaries.super_carnot_blocked_by_z3.pass],
  ["cvc5 fixed fence", data.boundaries.super_carnot_blocked_by_cvc5_fixed_case.pass],
  ["shared four-state cycle", data.boundaries.dual_stack_is_not_two_different_cycles.pass],
];
document.getElementById("checks").innerHTML = checks.map(([label, pass]) => `
  <div class="check"><b>${pass ? "PASS" : "OPEN"}</b><br><span class="muted">${label}</span></div>
`).join("");
</script>
</body>
</html>
