<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine Dual Stack</title>
<style>
  :root {
    --bg: #10120f;
    --panel: #181b16;
    --panel2: #20241d;
    --line: #3a4233;
    --text: #eeeadf;
    --muted: #a7aa9e;
    --hot: #d95f43;
    --cold: #3aa0a7;
    --work: #d8b65c;
    --ok: #7fb069;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; grid-template-columns: 320px 1fr; }
  aside { border-right: 1px solid var(--line); padding: 18px; background: #0d100c; }
  section { padding: 18px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: 20px; }
  h2 { color: var(--muted); font-size: 12px; text-transform: uppercase; margin-bottom: 10px; }
  .muted { color: var(--muted); }
  .mono { font-family: "SFMono-Regular", Consolas, monospace; }
  button {
    width: 100%;
    text-align: left;
    margin-top: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    padding: 10px;
    cursor: pointer;
  }
  button.active { border-color: var(--work); background: var(--panel2); }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .metric { border: 1px solid var(--line); background: var(--panel); padding: 10px; }
  .metric b { display: block; font-size: 18px; }
  .metric span { color: var(--muted); font-size: 11px; }
  .loops { display: grid; grid-template-columns: repeat(2, minmax(280px, 1fr)); gap: 14px; }
  .loop { border: 1px solid var(--line); background: var(--panel); }
  .loop header { padding: 13px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .stages { display: grid; gap: 6px; padding: 12px; }
  .stage { display: grid; grid-template-columns: 1fr 80px 80px; gap: 8px; border: 1px solid var(--line); background: #131710; padding: 8px; font-size: 12px; }
  .stage span { color: var(--muted); font-size: 11px; }
  .axes { margin-top: 16px; border: 1px solid var(--line); background: var(--panel); padding: 14px; }
  .axisgrid { display: grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap: 8px; }
  .axis { border: 1px solid var(--line); background: #131710; padding: 9px; }
  .axis b { font-size: 13px; }
  .axis p { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .rosetta { margin-top: 16px; border: 1px solid var(--line); background: var(--panel); padding: 14px; }
  .rosetta-grid { display: grid; grid-template-columns: repeat(3, minmax(180px, 1fr)); gap: 8px; }
  .rosetta-row { border: 1px solid var(--line); background: #131710; padding: 9px; font-size: 12px; line-height: 1.35; }
  .rosetta-row span { display: block; color: var(--muted); margin-top: 4px; }
  .wheel-wrap { margin-top: 16px; border: 1px solid var(--line); background: var(--panel); padding: 14px; }
  .wheel-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: center; }
  .wheel {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: conic-gradient(var(--hot) 0 180deg, var(--cold) 180deg 360deg);
    animation: spin 28s linear infinite;
  }
  .wheel::before {
    content: "";
    position: absolute;
    inset: 42px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 25%, var(--cold) 0 10px, var(--hot) 11px 50%, transparent 51%),
                radial-gradient(circle at 50% 75%, var(--hot) 0 10px, var(--cold) 11px 50%, transparent 51%);
    border: 1px solid rgba(238, 234, 223, 0.35);
  }
  .tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1px;
    height: 104px;
    transform-origin: 0 0;
    transform: rotate(var(--angle));
    background: linear-gradient(var(--text), transparent 22px);
    opacity: 0.8;
  }
  .tick:nth-child(8n) { width: 2px; opacity: 1; }
  .wheel-key { display: grid; grid-template-columns: repeat(2, minmax(160px, 1fr)); gap: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    .metrics, .loops, .axisgrid, .rosetta-grid, .wheel-layout, .wheel-key { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <aside>
    <h1>Dual-Stack Engines</h1>
    <p class="muted" style="margin-top:8px; line-height:1.4">Receipt-backed Carnot and Szilard loops with local Ax0-Ax6 candidate mappings.</p>
    <div id="nav"></div>
  </aside>
  <section>
    <div id="metrics" class="metrics"></div>
    <div id="loops" class="loops"></div>
    <div class="axes">
      <h2>Local Ax0-Ax6 Candidate Mapping</h2>
      <div id="axes" class="axisgrid"></div>
    </div>
    <div class="rosetta">
      <h2>Carnot / Szilard Rosetta</h2>
      <div id="rosetta" class="rosetta-grid"></div>
      <div id="tiers" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="qitRows" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="triadModes" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="entropyTopology" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="orderGraveyard" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="legoRegistry" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="coupledArray" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="engineLabOpenRows" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="engineLabNextWork" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="engineLabSuccessorCoverage" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="carnotAsymGraveyard" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="szilardOpenGraveyard" class="rosetta-grid" style="margin-top:8px"></div>
      <div id="sidecarGraveyard" class="rosetta-grid" style="margin-top:8px"></div>
    </div>
    <div class="wheel-wrap">
      <h2>Symbolic 64-State Wheel</h2>
      <div class="wheel-layout">
        <div id="wheel" class="wheel"></div>
        <div id="wheelKey" class="wheel-key"></div>
      </div>
    </div>
  </section>
</main>
<script src="carnot-dual-stack-data.js"></script>
<script src="szilard-dual-stack-data.js"></script>
<script src="cycle-invariant-correlation-data.js"></script>
<script src="six-bit-gray-code-cycle-data.js"></script>
<script src="rosetta-triad-modes-data.js"></script>
<script src="rosetta-triad-entropy-topology-data.js"></script>
<script src="rosetta-triad-order-graveyard-data.js"></script>
<script src="cycle-receipt-coupling-candidate-registry-data.js"></script>
<script src="rosetta-lego-coupled-array-data.js"></script>
<script src="rosetta-lego-coupled-array-graveyard-data.js"></script>
<script src="engine-lab-open-row-audit-data.js"></script>
<script src="engine-lab-next-work-queue-data.js"></script>
<script src="engine-lab-successor-coverage-data.js"></script>
<script src="szilard-open-row-consolidation-data.js"></script>
<script src="carnot-asymmetric-direction-graveyard-data.js"></script>
<script src="szilard-open-failure-graveyard-data.js"></script>
<script src="engine-lab-sidecar-graveyard-data.js"></script>
<script>
const engines = {
  carnot: window.CARNOT_DUAL_STACK_DATA,
  szilard: window.SZILARD_DUAL_STACK_DATA,
};
const rosetta = window.ENGINE_ROSETTA_DATA;
const iching = window.SIX_BIT_GRAY_CODE_CYCLE_DATA;
const triad = window.ROSETTA_TRIAD_MODES_DATA;
const entropyTopology = window.ROSETTA_TRIAD_ENTROPY_TOPOLOGY_DATA;
const orderGraveyard = window.ROSETTA_TRIAD_ORDER_GRAVEYARD_DATA;
const legoRegistry = window.CYCLE_RECEIPT_COUPLING_CANDIDATE_REGISTRY_DATA;
const coupledArray = window.ROSETTA_LEGO_COUPLED_ARRAY_DATA;
const coupledGraveyard = window.ROSETTA_LEGO_COUPLED_ARRAY_GRAVEYARD_DATA;
const engineLabOpenRows = window.ENGINE_LAB_OPEN_ROW_AUDIT_DATA;
const engineLabNextWork = window.ENGINE_LAB_NEXT_WORK_QUEUE_DATA;
const engineLabSuccessorCoverage = window.ENGINE_LAB_SUCCESSOR_COVERAGE_DATA;
const carnotAsymGraveyard = window.CARNOT_ASYMMETRIC_DIRECTION_GRAVEYARD_DATA;
const szilardOpenGraveyard = window.SZILARD_OPEN_FAILURE_GRAVEYARD_DATA;
const sidecarGraveyard = window.ENGINE_LAB_SIDECAR_GRAVEYARD_DATA;
let active = "carnot";
const fmt = v => Number.isFinite(v) ? v.toFixed(6) : String(v);
function renderNav() {
  document.getElementById("nav").innerHTML = Object.entries(engines).map(([id, data]) => `
    <button class="${id === active ? "active" : ""}" onclick="active='${id}'; render()">
      <b>${id === "carnot" ? "Carnot" : "Szilard"}</b><br>
      <span class="muted">${data.summary.all_pass ? "passes" : "open"} · ${data.summary.load_bearing_tool_count}/${data.summary.tool_count} tools</span>
    </button>
  `).join("");
}
function metricPairs(data) {
  if (active === "carnot") {
    return [
      ["efficiency", data.summary.forward_efficiency],
      ["bound", data.summary.forward_carnot_bound],
      ["reverse COP", data.summary.reverse_cop],
      ["tools", `${data.summary.load_bearing_tool_count}/${data.summary.tool_count}`],
    ];
  }
  return [
    ["information", data.summary.information_gain],
    ["free-energy gain", data.summary.system_free_energy_gain],
    ["erasure cost", data.summary.erasure_cost],
    ["tools", `${data.summary.load_bearing_tool_count}/${data.summary.tool_count}`],
  ];
}
function renderLoop(loop, title) {
  const stages = loop.stage_trace.map(row => `
    <div class="stage">
      <div><b>${row.kind}</b><br><span>${row.before} -> ${row.after}</span></div>
      <div class="mono">${fmt(row.delta_entropy ?? row.record_entropy_delta ?? row.information_delta ?? 0)}</div>
      <div class="mono">${fmt(row.work_by_system ?? row.free_energy_gain ?? 0)}</div>
    </div>
  `).join("");
  return `<article class="loop"><header><h3>${title}</h3><span class="muted">${loop.role}</span></header><div class="stages">${stages}</div></article>`;
}
function render() {
  const data = engines[active];
  renderNav();
  document.getElementById("metrics").innerHTML = metricPairs(data).map(([k, v]) => `<div class="metric"><b>${typeof v === "number" ? fmt(v) : v}</b><span>${k}</span></div>`).join("");
  document.getElementById("loops").innerHTML = [
    renderLoop(data.loops.inductive_heating_loop, "Inductive / Heating"),
    renderLoop(data.loops.deductive_cooling_loop, "Deductive / Cooling"),
  ].join("");
  document.getElementById("axes").innerHTML = Object.entries(data.axes_candidate_model.axes).map(([id, axis]) => `
    <div class="axis"><b>${id} · ${axis.local_name}</b><p>${axis.degree_of_freedom}</p><p>${axis.observable || ""}</p></div>
  `).join("");
  document.getElementById("rosetta").innerHTML = rosetta.rosetta_rows.slice(0, 8).map(row => `
    <div class="rosetta-row">
      <b>${row.row}</b>
      <span>${row.status}</span>
      <span>Carnot: ${row.carnot}</span>
      <span>Szilard: ${row.szilard}</span>
      <span>${row.boundary}</span>
    </div>
  `).join("");
  document.getElementById("tiers").innerHTML = rosetta.tier_correlations.map(row => `
    <div class="rosetta-row">
      <b>Tier ${row.tier} · ${row.name}</b>
      <span>${row.evidence}</span>
      <span>Carnot: ${row.carnot}</span>
      <span>Szilard: ${row.szilard}</span>
      <span>Next: ${row.next_allowed}</span>
    </div>
  `).join("");
  document.getElementById("qitRows").innerHTML = rosetta.triadic_qit_rows.map(row => `
    <div class="rosetta-row">
      <b>${row.row}</b>
      <span>${row.status}</span>
      <span>Carnot: ${row.carnot}</span>
      <span>Szilard: ${row.szilard}</span>
      <span>QIT-adjacent: ${row.qit_adjacent}</span>
      <span>${row.boundary}</span>
    </div>
  `).join("");
  document.getElementById("triadModes").innerHTML = (triad?.mode_matrix || []).map(row => `
    <div class="rosetta-row">
      <b>${row.engine} · ${row.mode}</b>
      <span>${row.pass ? "passes" : "open"}</span>
      <span>${row.claim}</span>
      <span>${row.geometry}</span>
      <span>${row.entropy_readout}</span>
      <span>${row.boundary}</span>
    </div>
  `).join("");
  document.getElementById("entropyTopology").innerHTML = (entropyTopology?.entropy_rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.engine} · entropy</b>
      <span>${row.family_pass ? "passes" : "open"}</span>
      <span>H: ${fmt(row.entropy_family.shannon)}</span>
      <span>R2: ${fmt(row.entropy_family.renyi_2)}</span>
      <span>T2: ${fmt(row.entropy_family.tsallis_2)}</span>
      <span>support: ${row.support_size}</span>
    </div>
  `).join("") + (entropyTopology?.topology_rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.engine} · topology</b>
      <span>${row.topology_pass ? "passes" : "open"}</span>
      <span>nodes: ${row.nodes}; edges: ${row.edges}</span>
      <span>beta0: ${row.beta0_laplacian}; beta1: ${row.beta1_cycle_rank}</span>
      <span>gap: ${fmt(row.laplacian_spectral_gap)}</span>
    </div>
  `).join("");
  document.getElementById("orderGraveyard").innerHTML = (orderGraveyard?.variant_rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.engine} · ${row.variant}</b>
      <span>${row.status}</span>
      <span>expected: ${row.expected}</span>
      <span>${row.reason}</span>
    </div>
  `).join("");
  document.getElementById("legoRegistry").innerHTML = (legoRegistry?.registry_rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.lego_id} · registry</b>
      <span>${row.source_all_pass ? "source passes" : "source open"}</span>
      <span>modes: ${Object.entries(row.sim_type_coverage).filter(([, ok]) => ok).map(([mode]) => mode).join(", ")}</span>
      <span>axes: ${row.axis_slots.length}; entropy families: ${row.entropy_families.length}</span>
      <span>tools: ${row.tools_used.length}; graveyard variants: ${row.graveyard_variants.length}</span>
    </div>
  `).join("") + (legoRegistry?.coupling_matrix || []).map(row => `
    <div class="rosetta-row">
      <b>${row.left} ↔ ${row.right}</b>
      <span>${row.allowed_next ? "allowed next" : "blocked"}</span>
      <span>modes: ${row.shared_modes.join(", ")}</span>
      <span>shared tools: ${row.shared_tool_count}; shared entropy: ${row.shared_entropy_families.length}</span>
      <span>${row.claim_ceiling}</span>
    </div>
  `).join("");
  document.getElementById("coupledArray").innerHTML = [
    ["coupled graph", `pairs: ${coupledArray?.summary?.coupled_pair_count ?? 0}; pass: ${coupledArray?.summary?.all_pass ?? false}`],
    ["density", `entropy: ${fmt(coupledArray?.coupling_density?.shannon_entropy ?? 0)}; qutip trace: ${fmt(coupledArray?.coupling_density?.qutip_trace ?? 0)}`],
    ["proof fences", `z3: ${coupledArray?.proof_fences?.z3_blocks_qit_promotion?.result ?? "missing"}; cvc5: ${coupledArray?.proof_fences?.cvc5_blocks_qit_promotion?.result ?? "missing"}`],
    ["graveyard", `${coupledGraveyard?.summary?.variant_count ?? 0} coupled-array mutations; pass: ${coupledGraveyard?.summary?.all_pass ?? false}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("");
  document.getElementById("engineLabOpenRows").innerHTML = [
    ["engine lab coverage", `${engineLabOpenRows?.summary?.available_rows ?? 0} rows; missing: ${engineLabOpenRows?.summary?.missing_rows ?? "unknown"}`],
    ["open rows", `${engineLabOpenRows?.summary?.nonpassing_row_count ?? 0} nonpassing; classified: ${(engineLabOpenRows?.summary?.unclassified_open_rows ?? 0) === 0}`],
    ["audit classes", Object.entries(engineLabOpenRows?.summary?.audit_class_counts || {}).map(([k, v]) => `${k}: ${v}`).join("; ") || "missing"],
    ["promotion gate", `QIT/axis gate closed: ${!(engineLabOpenRows?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("") + (engineLabOpenRows?.rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.row_id}</b>
      <span>${row.audit_class}</span>
      <span>${row.next_allowed_action}</span>
      <span>${row.failed_check_count} failed checks; target: ${row.target_qit_row_id || "none"}</span>
      <span>passing successors: ${row.passing_successor_count ?? 0}</span>
      <span>consolidated recheck: ${row.consolidated_admission_status || "not_run"}</span>
      <span>${row.promotion_blocker}</span>
    </div>
  `).join("");
  document.getElementById("engineLabNextWork").innerHTML = [
    ["next work queue", `${engineLabNextWork?.summary?.open_row_count ?? 0} open rows; top: ${engineLabNextWork?.summary?.top_row_id || "none"}`],
    ["repair gaps", `${engineLabNextWork?.summary?.repair_gap_count ?? 0}; open-lab failures: ${engineLabNextWork?.summary?.open_lab_failure_count ?? 0}`],
    ["promotion gate", `QIT/axis gate closed: ${!(engineLabNextWork?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("") + (engineLabNextWork?.rows || []).slice(0, 8).map(row => `
    <div class="rosetta-row">
      <b>${row.row_id}</b>
      <span>${row.recommended_lane}</span>
      <span>${row.next_allowed_action}</span>
      <span>${row.audit_class}; failed checks: ${row.failed_check_count}</span>
      <span>${row.priority_bucket || "unbucketed"} ${row.translation_closeness_score == null ? "" : fmt(row.translation_closeness_score)}</span>
      <span>${row.promotion_blocker}</span>
    </div>
  `).join("");
  document.getElementById("engineLabSuccessorCoverage").innerHTML = [
    ["successor-layer coverage", `${engineLabSuccessorCoverage?.summary?.queue_row_count ?? 0} queue rows; active uncovered: ${engineLabSuccessorCoverage?.summary?.active_uncovered_row_count ?? "unknown"}`],
    ["coverage sources", `successor: ${engineLabSuccessorCoverage?.summary?.covered_by_successor_count ?? 0}; consolidated: ${engineLabSuccessorCoverage?.summary?.covered_by_consolidated_closed_count ?? 0}; superseded: ${engineLabSuccessorCoverage?.summary?.covered_by_superseded_count ?? 0}`],
    ["source layer", `preserved negative: ${engineLabSuccessorCoverage?.summary?.source_rows_preserved_negative ?? false}; matrix all_pass remains false`],
    ["receipt vintage", `${engineLabSuccessorCoverage?.generated_at || "missing"}; schema errors: ${engineLabSuccessorCoverage?.summary?.schema_error_count ?? "unknown"}`],
    ["promotion gate", `QIT/GStack/axis gate closed: ${!(engineLabSuccessorCoverage?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("") + (engineLabSuccessorCoverage?.rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.row_id}</b>
      <span>${row.covered ? "successor-layer covered" : "uncovered"}</span>
      <span>${row.recommended_lane}</span>
      <span>source negative preserved: ${row.source_negative_preserved}</span>
      <span>QIT/GStack/axis gate closed: ${!row.qit_or_axis_promotion_allowed}</span>
    </div>
  `).join("");
  document.getElementById("carnotAsymGraveyard").innerHTML = [
    ["Carnot asymmetry graveyard", `${carnotAsymGraveyard?.summary?.variant_count ?? 0} variants; killed: ${carnotAsymGraveyard?.summary?.killed_count ?? 0}; survived: ${carnotAsymGraveyard?.summary?.survived_count ?? 0}`],
    ["source layer", `preserved negative: ${!(carnotAsymGraveyard?.summary?.source_rows_closed ?? false)}; QIT/axis gate closed: ${!(carnotAsymGraveyard?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("") + (carnotAsymGraveyard?.rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.variant_id}</b>
      <span>${row.verdict}</span>
      <span>${row.expected}</span>
      <span>${row.observed}</span>
      <span>${row.next_allowed_action}</span>
    </div>
  `).join("");
  document.getElementById("szilardOpenGraveyard").innerHTML = [
    ["Szilard open-failure graveyard", `${szilardOpenGraveyard?.summary?.variant_count ?? 0} variants; killed: ${szilardOpenGraveyard?.summary?.killed_count ?? 0}; survived: ${szilardOpenGraveyard?.summary?.survived_count ?? 0}`],
    ["source layer", `preserved negative: ${!(szilardOpenGraveyard?.summary?.source_rows_closed ?? false)}; QIT/axis gate closed: ${!(szilardOpenGraveyard?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("") + (szilardOpenGraveyard?.rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.variant_id}</b>
      <span>${row.verdict}</span>
      <span>${row.expected}</span>
      <span>${row.observed}</span>
      <span>${row.next_allowed_action}</span>
    </div>
  `).join("");
  document.getElementById("sidecarGraveyard").innerHTML = [
    ["Readout/topology sidecar graveyard", `${sidecarGraveyard?.summary?.variant_count ?? 0} variants; killed: ${sidecarGraveyard?.summary?.killed_count ?? 0}; survived: ${sidecarGraveyard?.summary?.survived_count ?? 0}`],
    ["source layer", `preserved negative: ${!(sidecarGraveyard?.summary?.source_rows_closed ?? false)}; QIT/axis gate closed: ${!(sidecarGraveyard?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("") + (sidecarGraveyard?.rows || []).map(row => `
    <div class="rosetta-row">
      <b>${row.variant_id}</b>
      <span>${row.verdict}</span>
      <span>${row.expected}</span>
      <span>${row.observed}</span>
      <span>${row.next_allowed_action}</span>
    </div>
  `).join("");
  document.getElementById("wheel").innerHTML = Array.from({length: 64}, (_, i) => `<span class="tick" style="--angle:${i * 5.625}deg"></span>`).join("");
  const ichingProof = iching?.summary?.all_pass ? "symbolic sim passes" : "symbolic sim missing/open";
  const ichingGraveyard = iching?.graveyard_variants?.map(row => `${row.variant}: ${row.status}`).join("; ") || "no variants loaded";
  document.getElementById("wheelKey").innerHTML = [
    ["state count", `${iching?.summary?.state_count ?? 64} binary slots; ${ichingProof}`],
    ["axis slots", rosetta.summary.shared_axis_slots.join(", ")],
    ["evidence", `${rosetta.summary.rosetta_row_count} Rosetta rows, ${rosetta.summary.tier_count} tiers, ${rosetta.summary.triadic_qit_row_count} QIT-adjacent rows, ${iching?.summary?.rosetta_row_count ?? 0} I Ching rows, ${triad?.summary?.mode_row_count ?? 0} triad mode rows, ${entropyTopology?.summary?.entropy_family_count ?? 0} entropy families, ${legoRegistry?.summary?.registry_row_count ?? 0} registry rows`],
    ["QIT gate", `strict missing: ${rosetta.summary.qit_missing_strict_subset_count}`],
    ["entropy gate", `strict missing: ${rosetta.summary.qit_entropy_missing_strict_row_count}`],
    ["I Ching operators", iching?.rosetta_rows?.find(row => row.slot === "operator")?.iching_64 || "single-line flip operator"],
    ["graveyard", ichingGraveyard],
    ["triad graveyard", `${triad?.summary?.graveyard_row_count ?? 0} variants; identity collapse blocked: ${triad?.summary?.identity_collapse_blocked ?? false}`],
    ["order graveyard", `${orderGraveyard?.summary?.variant_count ?? 0} variants; killed: ${orderGraveyard?.summary?.killed_count ?? 0}; survived: ${orderGraveyard?.summary?.survivor_count ?? 0}`],
    ["coupled array", `${coupledArray?.summary?.coupled_pair_count ?? 0} pairs; QIT gate: not admitted; graveyard variants: ${coupledGraveyard?.summary?.variant_count ?? 0}`],
    ["engine lab open rows", `${engineLabOpenRows?.summary?.nonpassing_row_count ?? 0} classified; QIT/axis gate closed: ${!(engineLabOpenRows?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
    ["next work queue", `${engineLabNextWork?.summary?.open_row_count ?? 0} rows; top: ${engineLabNextWork?.summary?.top_row_id || "none"}`],
    ["successor coverage", `${engineLabSuccessorCoverage?.summary?.queue_row_count ?? 0} rows; active uncovered: ${engineLabSuccessorCoverage?.summary?.active_uncovered_row_count ?? "unknown"}; QIT/GStack/axis gate closed: ${!(engineLabSuccessorCoverage?.summary?.qit_or_axis_promotion_allowed ?? false)}`],
    ["Carnot asymmetry graveyard", `${carnotAsymGraveyard?.summary?.killed_count ?? 0} killed; ${carnotAsymGraveyard?.summary?.survived_count ?? 0} survived`],
    ["Szilard open graveyard", `${szilardOpenGraveyard?.summary?.killed_count ?? 0} killed; ${szilardOpenGraveyard?.summary?.survived_count ?? 0} survived`],
    ["sidecar graveyard", `${sidecarGraveyard?.summary?.killed_count ?? 0} killed; ${sidecarGraveyard?.summary?.survived_count ?? 0} survived`],
    ["boundary", "not an I Ching proof or QIT-engine admission"],
  ].map(([k, v]) => `<div class="rosetta-row"><b>${k}</b><span>${v}</span></div>`).join("");
}
render();
</script>
</body>
</html>
