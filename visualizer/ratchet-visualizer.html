<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "tone": "terminal"
}/*EDITMODE-END*/;

function Root() {
  const [tweaks, setTweaks] = React.useState(() => {
    try {
      const saved = localStorage.getItem('ratchet_tweaks');
      return saved ? { ...TWEAK_DEFAULTS, ...JSON.parse(saved) } : TWEAK_DEFAULTS;
    } catch (e) { return TWEAK_DEFAULTS; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('ratchet_tweaks', JSON.stringify(tweaks)); } catch (e) {}
  }, [tweaks]);
  return <App tweaks={tweaks} setTweaks={setTweaks} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
